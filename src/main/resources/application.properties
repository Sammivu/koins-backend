# ============================================================
# KOINS - Application Properties
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/

# ============================================================
# Database Configuration (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:koins_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Lagos
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ==========================================
# RABBITMQ
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# ============================================================
# JWT Configuration
# ============================================================
# Generate a strong Base64 secret: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:8c76dfab3bd536074b8b645cbf6cc79c6837b81710eec182c261bb333355c893}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Mail Configuration (SMTP)
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==========================================
# OTP
# ==========================================
app.otp.expiration-minutes=5

#=============================
# Crypo secret
#=======================
app.crypto.secret=1234567890123456

# ============================================================
# Paystack Configuration
# ============================================================
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=https://api.paystack.co
paystack.callback-url=https://afjds.com/order-success

# ============================================================
# Logging
# ============================================================
logging.level.com.middleware=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/koins.log

# ============================================================
# Springdoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
# Pagination defaults
# ============================================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

